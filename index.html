<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculadora de Datas</title>

<style>
:root {
  --bg: #0f172a;
  --card: #111827;
  --primary: #38bdf8;
  --primary-soft: #0ea5e9;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --border: #1f2937;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background: #020617;
  color: var(--text);
}

.container {
  max-width: 900px;
  margin: 20px auto;
  background: var(--card);
  border-radius: 22px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  overflow: hidden;
  border: 1px solid var(--border);
}

.header {
  padding: 35px 20px;
  background: linear-gradient(135deg, #020617, #0ea5e9);
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 0.5px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-bottom: 1px solid var(--border);
}

.tab-button {
  padding: 14px 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s;
}

.tab-button:hover { background: #020617; }

.tab-button.active {
  color: var(--primary);
  border-bottom: 2px solid var(--primary);
  background: #020617;
}

.content { padding: 24px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
}

input, select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #020617;
  color: var(--text);
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary);
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-soft));
  color: #020617;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
  font-size: 15px;
}

button:hover {
  transform: translateY(-1px) scale(1.01);
  box-shadow: 0 10px 25px rgba(14,165,233,0.35);
}

.resultado {
  margin-top: 20px;
  padding: 18px;
  border-radius: 14px;
  background: #020617;
  border: 1px solid var(--border);
  font-size: 15px;
  line-height: 1.5;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Mobile */
@media (max-width: 600px) {
  .tabs { grid-template-columns: 1fr 1fr; }
  .header h1 { font-size: 22px; }
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>🌙 Calculadora de Datas</h1>
  </div>

  <div class="tabs">
    <button class="tab-button active" data-tab="0">Diferença</button>
    <button class="tab-button" data-tab="1">Somar</button>
    <button class="tab-button" data-tab="2">Subtrair</button>
    <button class="tab-button" data-tab="3">Idade</button>
    <button class="tab-button" data-tab="4">Contagem</button>
  </div>

  <div class="content">

    <div class="tab-content active">
      <div class="grid">
        <input type="date" id="inicio" />
        <input type="date" id="fim" />
      </div>
      <button class="calc" id="btnDiff">Calcular diferença</button>
      <div class="resultado" id="resDiff"></div>
    </div>

    <div class="tab-content">
      <input type="date" id="base" />
      <div class="grid">
        <input type="number" id="dias" placeholder="Dias" />
        <input type="number" id="meses" placeholder="Meses" />
        <input type="number" id="anos" placeholder="Anos" />
      </div>
      <button class="calc" id="btnSomar">Calcular nova data</button>
      <div class="resultado" id="resNova"></div>
    </div>

    <div class="tab-content">
      <input type="date" id="baseSub" />
      <div class="grid">
        <input type="number" id="diasSub" placeholder="Dias" />
        <input type="number" id="mesesSub" placeholder="Meses" />
        <input type="number" id="anosSub" placeholder="Anos" />
      </div>
      <button class="calc" id="btnSub">Calcular nova data</button>
      <div class="resultado" id="resSub"></div>
    </div>

    <div class="tab-content">
      <input type="date" id="nasc" />
      <button class="calc" id="btnIdade">Calcular idade</button>
      <div class="resultado" id="resIdade"></div>
    </div>

    <div class="tab-content">
      <input type="date" id="evento" />
      <button class="calc" id="btnContagem">Ver contagem</button>
      <div class="resultado" id="resContagem"></div>
    </div>

  </div>
</div>

<script>
const tabs = document.querySelectorAll('.tab-button');
const contents = document.querySelectorAll('.tab-content');

tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    const i = btn.dataset.tab;

    tabs.forEach(b => b.classList.remove('active'));
    contents.forEach(c => c.classList.remove('active'));

    btn.classList.add('active');
    contents[i].classList.add('active');
  });
});

btnDiff.onclick = () => {
  if (!inicio.value || !fim.value) return;

  let d1 = new Date(inicio.value);
  let d2 = new Date(fim.value);

  if (d2 < d1) {
    [d1, d2] = [d2, d1];
  }

  d1.setHours(0,0,0,0);
  d2.setHours(0,0,0,0);

  // Total de dias
  const diffMs = d2 - d1;
  const totalDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  // Cálculo detalhado
  let anos = d2.getFullYear() - d1.getFullYear();
  let meses = d2.getMonth() - d1.getMonth();
  let dias = d2.getDate() - d1.getDate();

  if (dias < 0) {
    meses--;
    const ultimoMes = new Date(d2.getFullYear(), d2.getMonth(), 0);
    dias += ultimoMes.getDate();
  }

  if (meses < 0) {
    anos--;
    meses += 12;
  }

  const semanas = Math.floor(dias / 7);
  dias = dias % 7;

  resDiff.innerHTML = `
    <b>${totalDias} dias totais</b><br><br>
    ${anos} ano(s)<br>
    ${meses} mês(es)<br>
    ${semanas} semana(s)<br>
    ${dias} dia(s)
  `;
};

btnSomar.onclick = () => {
  if (!base.value) return;
  let d = new Date(base.value);
  d.setDate(d.getDate() + (+dias.value || 0));
  d.setMonth(d.getMonth() + (+meses.value || 0));
  d.setFullYear(d.getFullYear() + (+anos.value || 0));
  resNova.innerHTML = `<b>${d.toLocaleDateString('pt-BR')}</b>`;
};

btnSub.onclick = () => {
  if (!baseSub.value) return;
  let d = new Date(baseSub.value);
  d.setDate(d.getDate() - (+diasSub.value || 0));
  d.setMonth(d.getMonth() - (+mesesSub.value || 0));
  d.setFullYear(d.getFullYear() - (+anosSub.value || 0));
  resSub.innerHTML = `<b>${d.toLocaleDateString('pt-BR')}</b>`;
};

btnIdade.onclick = () => {
  if (!nasc.value) return;

  const n = new Date(nasc.value);
  const h = new Date();

  let anosCalc = h.getFullYear() - n.getFullYear();

  const mesAtual = h.getMonth();
  const diaAtual = h.getDate();

  const mesNasc = n.getMonth();
  const diaNasc = n.getDate();

  // Verifica se ainda NÃO fez aniversário este ano
  if (
    mesAtual < mesNasc ||
    (mesAtual === mesNasc && diaAtual < diaNasc)
  ) {
    anosCalc--;
  }

  const diasCalc = Math.floor((h - n) / (1000 * 60 * 60 * 24));

  resIdade.innerHTML = `
    <b>${anosCalc} anos</b><br>
    ${diasCalc} dias vividos
  `;
};

btnContagem.onclick = () => {
  if (!evento.value) return;
  const e = new Date(evento.value);
  const h = new Date();
  const dias = Math.ceil((e - h) / 86400000);
  resContagem.innerHTML = dias >= 0
    ? `<b>Faltam ${dias} dias</b>`
    : `<b>Já passou há ${Math.abs(dias)} dias</b>`;
};
</script>

</body>
</html>
