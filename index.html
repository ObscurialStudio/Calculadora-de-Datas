<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora de Datas</title>

<style>
:root {
    --primary: #2563eb;
    --secondary: #1e293b;
    --background: #f8fafc;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #0f172a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

/* Container principal */
.container {
    max-width: 720px;
    margin: 40px auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    overflow: hidden;
}

/* Cabeçalho */
.header {
    padding: 25px;
    background: linear-gradient(135deg, var(--primary), #1d4ed8);
    color: white;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

/* Abas */
.tabs {
    display: flex;
    background: #f1f5f9;
    border-bottom: 1px solid var(--border);
}

.tab-button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    font-weight: 600;
    cursor: pointer;
    color: var(--secondary);
    transition: all 0.3s;
}

.tab-button:hover {
    background: #e2e8f0;
}

.tab-button.active {
    background: var(--card);
    color: var(--primary);
    border-bottom: 3px solid var(--primary);
}

/* Conteúdo */
.content {
    padding: 25px;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* Formulários */
.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 5px;
}

input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
}

/* Botão */
button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(37,99,235,.3);
}

/* Resultado */
.resultado {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #f1f5f9;
    border-left: 5px solid var(--primary);
    font-size: 15px;
}

/* Responsivo */
@media (max-width: 600px) {
    .container {
        margin: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📅 Calculadora de Datas</h1>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="abrirAba(0)">Datas Avançadas</button>
        <button class="tab-button" onclick="abrirAba(1)">Somar / Subtrair</button>
        <button class="tab-button" onclick="abrirAba(2)">Idade</button>
    </div>

    <div class="content">

        <!-- ABA 1 -->
        <div class="tab-content active">
            <div class="form-group">
                <label>Data inicial</label>
                <div class="grid">
                    <input type="date" id="dataInicialData">
                    <input type="time" id="dataInicialHora">
                </div>
            </div>

            <div class="form-group">
                <label>Data final</label>
                <div class="grid">
                    <input type="date" id="dataFinalData">
                    <input type="time" id="dataFinalHora">
                </div>
            </div>

            <button onclick="calcularDiferenca()">Calcular Diferença</button>
            <div class="resultado" id="resultado"></div>
        </div>

        <!-- ABA 2 -->
        <div class="tab-content">
            <div class="form-group">
                <label>Data base</label>
                <input type="date" id="dataBase">
            </div>

            <div class="form-group">
                <label>Operação</label>
                <select id="operacao">
                    <option value="somar">Somar</option>
                    <option value="subtrair">Subtrair</option>
                </select>
            </div>

            <div class="grid">
                <input type="number" id="anos" placeholder="Anos" value="0">
                <input type="number" id="meses" placeholder="Meses" value="0">
                <input type="number" id="semanas" placeholder="Semanas" value="0">
                <input type="number" id="dias" placeholder="Dias" value="0">
            </div>

            <button onclick="calcularNovaData()">Calcular Nova Data</button>
            <div class="resultado" id="resultadoSoma"></div>
        </div>

        <!-- ABA 3 -->
        <div class="tab-content">
            <div class="form-group">
                <label>Data de nascimento</label>
                <input type="date" id="nascimento">
            </div>

            <button onclick="calcularIdade()">Calcular Idade</button>
            <div class="resultado" id="resultadoIdade"></div>
        </div>

    </div>
</div>

<script>
function abrirAba(i) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content')[i].classList.add('active');
    document.querySelectorAll('.tab-button')[i].classList.add('active');
}

function calcularDiferenca() {
    if (!dataInicialData.value || !dataFinalData.value) {
        resultado.innerHTML = "Selecione as duas datas.";
        return;
    }

    const inicio = new Date(`${dataInicialData.value}T${dataInicialHora.value || "00:00"}`);
    const fim = new Date(`${dataFinalData.value}T${dataFinalHora.value || "00:00"}`);

    if (inicio > fim) {
        resultado.innerHTML = "A data final deve ser maior que a inicial.";
        return;
    }

    let anos = fim.getFullYear() - inicio.getFullYear();
    let meses = fim.getMonth() - inicio.getMonth();
    let dias = fim.getDate() - inicio.getDate();

    if (dias < 0) {
        meses--;
        dias += new Date(fim.getFullYear(), fim.getMonth(), 0).getDate();
    }

    if (meses < 0) {
        anos--;
        meses += 12;
    }

    const ms = fim - inicio;

    resultado.innerHTML = `
        <strong>${anos} anos, ${meses} meses e ${dias} dias</strong><br><br>
        ${Math.floor(ms / 86400000)} dias •
        ${Math.floor(ms / 3600000)} horas •
        ${Math.floor(ms / 60000)} minutos •
        ${Math.floor(ms / 1000)} segundos
    `;
}

function calcularNovaData() {
    if (!dataBase.value) {
        resultadoSoma.innerHTML = "Selecione a data base.";
        return;
    }

    const fator = operacao.value === "subtrair" ? -1 : 1;
    let data = new Date(dataBase.value);

    data.setFullYear(data.getFullYear() + fator * +anos.value);
    data.setMonth(data.getMonth() + fator * +meses.value);
    data.setDate(data.getDate() + fator * (+semanas.value * 7 + +dias.value));

    resultadoSoma.innerHTML = `Resultado: <strong>${data.toLocaleDateString("pt-BR")}</strong>`;
}

function calcularIdade() {
    if (!nascimento.value) return;

    const nasc = new Date(nascimento.value);
    const hoje = new Date();

    let anos = hoje.getFullYear() - nasc.getFullYear();
    let meses = hoje.getMonth() - nasc.getMonth();
    let dias = hoje.getDate() - nasc.getDate();

    if (dias < 0) {
        meses--;
        dias += new Date(hoje.getFullYear(), hoje.getMonth(), 0).getDate();
    }
    if (meses < 0) {
        anos--;
        meses += 12;
    }

    resultadoIdade.innerHTML = `
        <strong>${anos} anos, ${meses} meses e ${dias} dias</strong><br>
        Dias vividos: ${Math.floor((hoje - nasc) / 86400000)}
    `;
}
</script>

</body>
</html>
